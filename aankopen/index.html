<!doctype html>
<html lang="nl"><head><script>(function(){try{var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;var q=new URLSearchParams(location.search);var sameRef=document.referrer&&new URL(document.referrer).origin===location.origin;if(standalone&&!q.has('hcnav')&&!sameRef){location.replace('../?hcstart=1');}}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#957AC1"><title>Aankopen · Huize Chaos</title><link rel="stylesheet" href="style.css?v=1.4.47"></head>
<body><main class="app"><header class="hc-module-top"><a class="hc-brand" href="../"><img src="../icons/icon-192.png" alt=""><img src="../assets/huize-chaos-wordmark-v1111.png" alt="Huize Chaos"></a><span class="hc-version">V1.4.47</span><span id="sync" hidden></span></header>
<section class="title"><div class="title-icon">🧾</div><div><h1>Aankopen</h1><p>Bewaar grotere aankopen, aankoopbonnen en garantiegegevens op één plek.</p></div></section>
<div id="purchaseApp" hidden>
  <div class="tools"><input id="search" type="search" placeholder="Zoek product, winkel of categorie"><button id="newPurchase" class="primary">+ Aankoop toevoegen</button></div>
  <div class="filter-row"><select id="categoryFilter"><option value="">Alle categorieën</option></select><select id="sort"><option value="date-desc">Nieuwste eerst</option><option value="date-asc">Oudste eerst</option><option value="price-desc">Hoogste bedrag</option><option value="name">Product A-Z</option></select></div>
  <div id="purchases" class="purchase-list"></div>
</div><div id="message" class="message">Aanmelden…</div></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><button type="button" id="backEditor" class="back">‹ Terug</button><h2 id="editorTitle">Aankoop toevoegen</h2></div><input id="purchaseId" type="hidden">
<div class="grid"><label>Product / omschrijving *<input id="name" required maxlength="140" placeholder="Bijv. stofzuiger"></label><label>Aankoopdatum *<input id="date" type="date" required></label><label>Winkel / webshop *<input id="store" required maxlength="120" placeholder="Bijv. Coolblue"></label><label>Bedrag *<div class="money"><span>€</span><input id="price" inputmode="decimal" required placeholder="0,00"></div></label><label>Categorie<div class="category-entry"><select id="category"><option value="">Kies categorie</option></select><button type="button" id="addCategory" class="category-add">+ Nieuwe categorie</button></div></label><label>Garantie tot<input id="warranty" type="date"></label><label>Merk / type<input id="model" maxlength="140" placeholder="Optioneel"></label><label>Serienummer<input id="serial" maxlength="140" placeholder="Optioneel"></label></div>
<label>Notitie<textarea id="note" rows="3" placeholder="Bijv. informatie over garantie, retourneren of onderdelen"></textarea></label>
<section class="receipt-box"><div><strong>Aankoopbon of garantiebewijs</strong><small>Foto of PDF. Foto’s worden automatisch verkleind voor synchronisatie.</small></div><label class="file-button" for="attachment">Bestand kiezen</label><input id="attachment" type="file" accept="image/*,.pdf,application/pdf"><div id="attachmentInfo" class="attachment-info">Nog geen bestand gekoppeld.</div><button id="removeAttachment" type="button" class="text-button" hidden>Bon verwijderen</button></section>
<div class="actions"><button type="button" id="cancel">Annuleren</button><button type="submit" class="primary">Aankoop opslaan</button></div></form></dialog>
<dialog id="detail"><article class="detail-card"><div class="dialog-head"><button type="button" id="backDetail" class="back">‹ Terug</button><div class="detail-actions"><button id="editPurchase" type="button">Wijzigen</button><button id="deletePurchase" type="button" class="danger">Verwijderen</button></div></div><div id="detailContent"></div></article></dialog>
<script type="module" src="app.js?v=1.4.47"></script></body></html>
