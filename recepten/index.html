<!doctype html>
<html lang="nl">
<head><script>(function(){try{var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;var q=new URLSearchParams(location.search);var sameRef=document.referrer&&new URL(document.referrer).origin===location.origin;if(standalone&&!q.has('hcnav')&&!sameRef){location.replace('../?hcstart=1');}}catch(e){}})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Weekmenu & Recepten · Huize Chaos</title>
  <link rel="stylesheet" href="style.css?v=1.4.101">
</head>
<body>
<main class="recipes">
  <header class="module-topbar">
    <a class="module-brand" href="../" aria-label="Terug naar Huize Chaos">
      <img class="module-app-icon" src="../icons/icon-192.png" alt=""><img class="module-wordmark" src="../assets/huize-chaos-wordmark-v1111.png" alt="Huize Chaos">
    </a>
    <div class="module-meta"><span class="module-version">V1.4.104</span><span id="recipeSyncStatus" class="module-sync">Recepten laden…</span></div>
  </header>
  <section class="module-heading">
    <p>Huize Chaos</p>
    <h1>Weekmenu & Recepten</h1>
  </section>

  <nav class="module-tabs" aria-label="Weekmenu en recepten">
    <button class="module-tab active" id="showWeekMenu" type="button">Weekmenu</button>
    <button class="module-tab" id="showRecipes" type="button">Recepten</button>
  </nav>

  <section id="weekMenuPanel" class="week-menu-panel">
    <div class="week-menu-head">
      <button class="week-nav" id="weekMenuPrev" type="button" aria-label="Vorige week">‹</button>
      <div>
        <button class="week-current-button" id="weekMenuTitle" type="button" title="Ga naar huidige week">Week</button>
        <small>Geen dagen, alleen je gekozen recepten</small>
      </div>
      <button class="week-nav" id="weekMenuNext" type="button" aria-label="Volgende week">›</button>
    </div>
    <div id="weekMenuContext" class="week-menu-context"></div><div id="weekMenuList" class="week-menu-list"></div>
  </section>

  <section id="recipeLibraryPanel" class="hidden">
    <div class="recipe-library-actions"><button class="btn primary" id="addRecipeManual" type="button">+ Recept toevoegen</button><button class="btn" id="importRecipeUrl" type="button">Recept importeren</button><button class="btn" id="addRecipeFromPhotos" type="button">Recept uit foto's</button><input id="recipePhotoImportInput" class="recipe-photo-input" type="file" accept="image/*" multiple></div>
    <div class="search"><input id="search" placeholder="Zoek recept…" autocomplete="off"></div><div id="smartRecipePicker"></div>
    <div class="stock-recipe-tools"><button class="btn" id="stockRecipeButton" type="button">Uit voorraad recepten zoeken</button><div id="stockPicker"></div></div>
    <div id="pending"></div>
    <div id="list" class="list"></div>
  </section>

  <section id="detail" class="detail hidden"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="recipes-data.js"></script>
<script type="module" src="app.js?v=1.4.101"></script>
</body>
</html>
