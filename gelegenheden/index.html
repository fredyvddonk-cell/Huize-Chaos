<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#957AC1">
  <title>Feestdagen & gelegenheden · Huize Chaos</title>
  <link rel="stylesheet" href="style.css?v=1.3.105">
</head>
<body>
<main class="app">
  <header class="module-topbar">
    <a class="module-brand" href="../" aria-label="Terug naar Huize Chaos"><img src="../assets/huize-chaos-wordmark-v1111.png" alt="Huize Chaos"></a>
    <div class="module-meta"><span class="module-version">V1.3.105</span><span id="occasionSyncStatus" class="module-sync">Laden…</span></div>
  </header>
  <section class="module-heading">
    <p>Huize Chaos</p>
    <h1>Feestdagen & gelegenheden</h1>
    <button id="addEvent" class="primary add-event">+ Gelegenheid</button>
  </section>
  <section id="list"></section>
</main>
<dialog id="eventDialog"><form id="eventForm" method="dialog"><h2 id="formTitle">Gelegenheid</h2><input type="hidden" id="eventId"><label>Naam<input id="eventName" required placeholder="Bijv. verjaardag, kerst, feestje"></label><div class="two"><label>Datum<input id="eventDate" type="date"></label><label>Aantal personen<input id="eventPeople" type="number" min="1" inputmode="numeric"></label></div><label>Notitie<textarea id="eventNote" rows="2" placeholder="Bijv. alles glutenvrij"></textarea></label><div class="actions"><button type="button" id="cancelEvent">Annuleren</button><button class="primary" value="default">Opslaan</button></div></form></dialog>
<dialog id="detailDialog"><div id="detail"></div></dialog>
<script src="../recepten/recipes-data.js"></script>
<script type="module" src="app.js?v=1.3.105"></script>
</body></html>
