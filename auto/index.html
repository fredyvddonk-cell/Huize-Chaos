<!doctype html><html lang="nl"><head><script>(function(){try{var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;var q=new URLSearchParams(location.search);var sameRef=document.referrer&&new URL(document.referrer).origin===location.origin;if(standalone&&!q.has('hcnav')&&!sameRef){location.replace('../?hcstart=1');}}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#957AC1"><title>Auto · Huize Chaos</title><link rel="stylesheet" href="style.css?v=1.4.46"></head><body>
<header class="hc-module-top"><a class="hc-brand" href="../" aria-label="Terug naar Huize Chaos"><img src="../icons/icon-192.png" alt=""><img class="hc-wordmark" src="../assets/huize-chaos-wordmark-v1111.png" alt="Huize Chaos"></a><span class="hc-version">V1.4.46</span><span id="syncStatus" class="hc-sync" hidden></span></header><section class="hc-heading"><p>Huize Chaos</p><h1>Auto</h1></section>
<div id="authGate" class="gate"><p id="authMessage">Meld je aan om Auto te openen.</p><button id="googleSignIn">Aanmelden met Google</button><button id="googleSignOut" hidden>Afmelden</button><div id="accessCodeBox" hidden><small>Gebruikers-ID: <span id="accessUid"></span></small><button id="copyAccessUid">Kopieer</button></div></div>
<main id="app" hidden>
<nav class="tabs"><button data-tab="reserve" class="active">Reserveren</button><button data-tab="km">Kilometers</button><button data-tab="fuel">Tankbeurten</button></nav>
<section id="reserve" class="page"><h2>Auto reserveren</h2><form id="reserveForm" class="card form"><label>Wie<input id="rWho" required></label><label>Datum<input id="rDate" type="date" required></label><div class="row"><label>Van<input id="rStart" type="time" required></label><label>Tot<input id="rEnd" type="time" required></label></div><label>Reden (optioneel)<input id="rReason"></label><button>Reservering opslaan</button><p id="conflict" class="error" hidden></p></form><div id="reserveList"></div></section>
<section id="km" class="page" hidden><h2>Kilometers</h2><form id="kmForm" class="card form"><label>Datum<input id="kDate" type="date" required></label><label>Bestemming<select id="kRoute"><option value="Werk">Werk · Vivent — 17,0 km retour</option><option value="JBZ">JBZ — 22,8 km retour</option><option value="WKZ">WKZ — 115,1 km retour</option><option value="UMCG">UMCG — 466,2 km retour</option></select></label><label>Bestemming / toelichting<input id="kNote"></label><label>Gereden kilometers<input id="kKm" type="number" min="0" step="0.1" required readonly></label><button>Rit opslaan</button></form><div class="summary" id="kmSummary"></div><button id="printCare" class="secondary">Jaaroverzicht ziekenhuis/zorg printen</button><div id="kmList"></div></section>
<section id="fuel" class="page" hidden><h2>Tankbeurten</h2><form id="fuelForm" class="card form"><input id="fEditId" type="hidden"><label>Datum<input id="fDate" type="date" required></label><label>Kilometerstand<input id="fOdo" type="number" min="0" step="1" required></label><label>Liters<input id="fLiters" type="number" min="0" step="0.01" required></label><label>Bedrag (€)<input id="fAmount" type="number" min="0" step="0.01" required></label><label>Literprijs (€)<input id="fPrice" type="number" min="0" step="0.001" placeholder="Automatisch berekend"></label><label class="check"><input id="fFull" type="checkbox"> Volgetankt</label><div class="fuel-form-actions"><button id="fSaveButton">Tankbeurt opslaan</button><button id="fCancelEdit" class="secondary" type="button" hidden>Annuleren</button></div></form><div class="summary" id="fuelSummary"></div><div id="fuelList"></div></section>
</main><dialog id="fuelActions" class="hc-dialog"><div class="hc-dialog-card"><h3 id="fuelActionTitle">Tankbeurt</h3><div class="hc-dialog-actions"><button id="fuelEdit" type="button">Wijzigen</button><button id="fuelDelete" type="button" class="danger">Verwijderen</button><button id="fuelClose" type="button" class="secondary">Annuleren</button></div></div></dialog><dialog id="fuelDeleteConfirm" class="hc-dialog"><div class="hc-dialog-card"><h3>Tankbeurt verwijderen?</h3><p>Weet je zeker dat je deze tankbeurt wilt verwijderen?</p><div class="hc-dialog-actions"><button id="fuelDeleteCancel" type="button" class="secondary">Annuleren</button><button id="fuelDeleteYes" type="button" class="danger">Verwijderen</button></div></div></dialog><script src="app.js?v=1.4.46"></script><script type="module" src="firebase.js?v=1.4.46"></script></body></html>
