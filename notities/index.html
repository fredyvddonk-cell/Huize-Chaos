<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#957AC1"><title>Mijn notities · Huize Chaos</title><link rel="stylesheet" href="style.css?v=1.4.1"></head><body><main class="app"><header><a href="../">‹ Huize Chaos</a><span>V1.4.1</span></header><h1>🔒 Mijn notities</h1><p class="intro">Persoonlijke notities. Niet zichtbaar voor andere gezinsleden.</p><div id="ownerApp" hidden><div class="tools"><input id="search" type="search" placeholder="Zoek in notities"><button id="newNote">+ Nieuwe notitie</button></div><div id="notes"></div></div><div id="message" class="message">Aanmelden…</div></main><dialog id="editor"><form id="form" method="dialog"><h2>Notitie</h2><input id="noteId" type="hidden"><label>Titel<input id="title" maxlength="120" required></label><label>Notitie<textarea id="body" rows="12" required></textarea></label><div class="actions"><button type="button" id="cancel">Annuleren</button><button class="primary" value="default">Opslaan</button></div></form></dialog><script type="module" src="app.js?v=1.4.1"></script></body></html>
